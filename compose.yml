# ------------------------------------------------------------------
# Entorno de desarrollo: Laravel (backend) + React (frontend)
#                        + MariaDB (base de datos) + Mailpit (correo)
#
# Todas las variables ${...} se leen del archivo .env que está junto
# a este compose.yml (cópialo desde .env.example).
# ------------------------------------------------------------------

services:

  # ---------------- Backend: Laravel sobre PHP + Apache ----------------
  backend:
    build:
      context: ./docker/backend
      args:
        PHP_VERSION: ${PHP_VERSION}
    ports:
      - "${BACKEND_PORT}:80"
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      APP_URL: ${APP_URL}
      # Conexión a la base de datos (servicio "db")
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      # Envío de correos a través de Mailpit (servicio "mailpit")
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    networks:
      - app_network

  # ---------------- Frontend: React con Vite ----------------
  frontend:
    build:
      context: ./docker/frontend
      args:
        NODE_VERSION: ${NODE_VERSION}
    ports:
      - "${FRONTEND_PORT}:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - app_network

  # ---------------- Base de datos: MariaDB ----------------
  db:
    image: mariadb:${MARIADB_VERSION}
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXTERNAL_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_network

  # ---------------- Envío de correos: Mailpit ----------------
  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION}
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"   # SMTP que usa Laravel
      - "${MAILPIT_UI_PORT}:8025"     # Bandeja web para ver los correos
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  db_data:
  frontend_node_modules:
